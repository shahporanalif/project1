<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Hello, I am Alif</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --aqua: #67e8f9;
        --violet: #c4b5fd;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
      }

      .orb {
        position: fixed;
        width: 36rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(24px);
        opacity: .5;
        pointer-events: none;
        animation: drift 13s ease-in-out infinite alternate;
      }

      .orb.one { background: #2563eb; top: -18rem; left: -12rem; }
      .orb.two { background: #7c3aed; bottom: -20rem; right: -10rem; animation-delay: -6s; }

      main {
        width: min(92vw, 760px);
        padding: clamp(2.5rem, 8vw, 5.75rem) clamp(1.5rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 28px;
        background: rgba(15, 23, 42, .62);
        box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
        animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        display: inline-flex;
        gap: .5rem;
        align-items: center;
        margin: 0 0 1.25rem;
        padding: .45rem .85rem;
        border-radius: 999px;
        color: var(--aqua);
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        background: rgba(103, 232, 249, .1);
      }

      .spark { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 14px currentColor; }

      h1 {
        margin: 0;
        font-size: clamp(3.25rem, 12vw, 7rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(115deg, #fff 20%, var(--aqua) 50%, var(--violet) 78%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p { max-width: 32rem; margin: 1.65rem auto 2rem; color: var(--muted); font-size: clamp(1rem, 2.4vw, 1.2rem); line-height: 1.65; }

      button {
        padding: .85rem 1.25rem;
        border: 0;
        border-radius: 999px;
        color: #0f172a;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(120deg, var(--aqua), var(--violet));
        box-shadow: 0 10px 28px rgba(103, 232, 249, .2);
        transition: transform .2s ease, box-shadow .2s ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 16px 35px rgba(103, 232, 249, .3); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      @keyframes arrive { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes drift { to { transform: translate(5rem, 3rem) scale(1.15); } }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <main>
      <div class="eyebrow"><span class="spark"></span>It works</div>
      <h1>Hello, I am Alif</h1>
      <p>A small beginning with a little polish, a splash of color, and room for your next big idea.</p>
      <button type="button" id="greet">Say hello back</button>
    </main>
    <script>
      document.getElementById("greet").addEventListener("click", (event) => {
        event.currentTarget.textContent = "Hello to you, too! ✨";
      });
    </script>
  </body>
</html>
